server:
  port: ${PORT:8080}

spring:
  application:
    name: oog-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

# ─────────────────────────────────────────────────────────────────
# Gateway custom config
# Each backend has:
#   id       → becomes the URL prefix:  /{id}/...
#   base-url → actual upstream server
#   routes   → whitelist: only these path+method combos are allowed
# ─────────────────────────────────────────────────────────────────
gateway:
  security:
    enabled: ${SECURITY_ENABLED:false}
    # When enabled=true, set these:
    # issuer-uri: ${OIDC_ISSUER_URI}
    # jwk-set-uri: ${OIDC_JWK_SET_URI}

  backends:

    # ── Test: MockAPI Legacy backend ──────────────────────────────
    # Call via: GET /mock-legacy/legacy/api/products/1
    # Forwards:       /legacy/api/products/1  → MOCK_API_BASE_URL
    - id: mock-legacy
      base-url: ${MOCK_API_BASE_URL:http://localhost:8081}
      routes:
        - path: /legacy/api/products/**
          methods: [ GET ]
        - path: /legacy/api/orders/**
          methods: [ GET ]
        - path: /legacy/api/users/**
          methods: [ GET ]
        - path: /legacy/api/payments/**
          methods: [ GET ]
        - path: /legacy/api/auth/login
          methods: [ POST ]
        - path: /health
          methods: [ GET ]

    # ── Test: MockAPI Modernized backend ─────────────────────────
    # Call via: GET /mock-modernized/modernized/api/products/1
    - id: mock-modernized
      base-url: ${MOCK_API_BASE_URL:http://localhost:8081}
      routes:
        - path: /modernized/api/products/**
          methods: [ GET ]
        - path: /modernized/api/orders/**
          methods: [ GET ]
        - path: /modernized/api/users/**
          methods: [ GET ]
        - path: /modernized/api/payments/**
          methods: [ GET ]
        - path: /modernized/api/auth/login
          methods: [ POST ]
        - path: /health
          methods: [ GET ]

    # ── Production: OOG Legacy backend ───────────────────────────
    # Uncomment and set OOG_LEGACY_BASE_URL when ready
    # - id: oog-pricing
    #   base-url: ${OOG_LEGACY_BASE_URL}
    #   routes:
    #     - path: /api/quotations/calculate-rate
    #       methods: [ POST ]
    #     - path: /api/quotations/tariffs/pol
    #       methods: [ POST ]
    #     - path: /api/quotations/tariffs/pod
    #       methods: [ POST ]
    #     - path: /api/quotations/oog-dimensions
    #       methods: [ POST ]
    #     - path: /api/quotations/filtered-ocean
    #       methods: [ POST ]
    #     - path: /api/quotations/filtered-port-con
    #       methods: [ POST ]
    #     - path: /api/quotations/check-container-type
    #       methods: [ GET ]
    #     - path: /api/oceans/by-criteria1
    #       methods: [ POST ]
    #     - path: /api/port-restrictions/**
    #       methods: [ GET ]

    # ── Production: OOG Supporting Service ───────────────────────
    # - id: oog-supporting
    #   base-url: ${OOG_SUPPORTING_BASE_URL}
    #   routes:
    #     - path: /api/exchange-rates/**
    #       methods: [ GET ]
    #     - path: /api/master-values/**
    #       methods: [ GET ]

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sonic.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
