# ─────────────────────────────────────────────────────────────────
# OOG Public API Gateway
# ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=oog-public-api

# CORS - allow all origins for PWA
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.sonic.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO

# ─────────────────────────────────────────────────────────────────
# Security (OAuth2 OIDC)
# ─────────────────────────────────────────────────────────────────
gateway.security.enabled=${SECURITY_ENABLED:false}
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI}

# ─────────────────────────────────────────────────────────────────
# Backend: mock-legacy
# Railway env: MOCK_LEGACY_BASE_URL
# ─────────────────────────────────────────────────────────────────
gateway.backends[0].id=mock-legacy
gateway.backends[0].base-url=${MOCK_LEGACY_BASE_URL:http://localhost:8081}
gateway.backends[0].routes[0].path=/legacy/api/products/**
gateway.backends[0].routes[0].methods[0]=GET
gateway.backends[0].routes[1].path=/legacy/api/orders/**
gateway.backends[0].routes[1].methods[0]=GET
gateway.backends[0].routes[2].path=/legacy/api/users/**
gateway.backends[0].routes[2].methods[0]=GET
gateway.backends[0].routes[3].path=/legacy/api/payments/**
gateway.backends[0].routes[3].methods[0]=GET
gateway.backends[0].routes[4].path=/legacy/api/auth/login
gateway.backends[0].routes[4].methods[0]=POST
gateway.backends[0].routes[5].path=/health
gateway.backends[0].routes[5].methods[0]=GET

# ─────────────────────────────────────────────────────────────────
# Backend: mock-modernized
# Railway env: MOCK_MODERNIZED_BASE_URL
# ─────────────────────────────────────────────────────────────────
gateway.backends[1].id=mock-modernized
gateway.backends[1].base-url=${MOCK_MODERNIZED_BASE_URL:http://localhost:8081}
gateway.backends[1].routes[0].path=/modernized/api/products/**
gateway.backends[1].routes[0].methods[0]=GET
gateway.backends[1].routes[1].path=/modernized/api/orders/**
gateway.backends[1].routes[1].methods[0]=GET
gateway.backends[1].routes[2].path=/modernized/api/users/**
gateway.backends[1].routes[2].methods[0]=GET
gateway.backends[1].routes[3].path=/modernized/api/payments/**
gateway.backends[1].routes[3].methods[0]=GET
gateway.backends[1].routes[4].path=/modernized/api/auth/login
gateway.backends[1].routes[4].methods[0]=POST
gateway.backends[1].routes[5].path=/health
gateway.backends[1].routes[5].methods[0]=GET

