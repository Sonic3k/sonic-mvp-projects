gateway:
  backends:

    # ── OOG Pricing Backend ───────────────────────────────────────
    # All pricing APIs exposed (users/master-values/audit-logs excluded)
    - id: oog-pricing
      base-url: ${OOG_PRICING_BASE_URL:http://localhost:8081}
      routes:
        - path: /api/quotations/**
          methods: [ GET, POST ]
        - path: /api/oceans/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/port-cons/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/port-restrictions/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/exchange-rates/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/negotiations/**
          methods: [ GET, POST, PUT ]
        - path: /api/oog-teus/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/oog-dimensions/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/pod-refs/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/pol-refs/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/formulas/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/formula-types/**
          methods: [ GET, POST, PUT, DELETE ]
        - path: /api/sq-files/**
          methods: [ GET, POST, PUT ]
        - path: /api/dropdown-lists/**
          methods: [ GET, POST ]
        - path: /api/version
          methods: [ GET ]

    # ── OOG Supporting Service ────────────────────────────────────
    # Migrated services: users, master-values, audit-logs
    # Read-only: no create/update/delete
    - id: oog-supporting
      base-url: ${OOG_SUPPORTING_BASE_URL:http://localhost:8082}
      routes:
        # users - readonly
        - path: /api/users/trades
          methods: [ GET ]
        - path: /api/users/exists
          methods: [ GET ]
        - path: /api/users/{loginId}
          methods: [ GET ]
        - path: /api/users/id/{id}
          methods: [ GET ]
        - path: /api/users/search
          methods: [ POST ]
        - path: /api/users/count
          methods: [ POST ]
        - path: /api/users/export
          methods: [ POST ]

        # master-values - readonly
        - path: /api/master-values/by-code-domain
          methods: [ GET ]
        - path: /api/master-values/by-code-domain-trade
          methods: [ GET ]
        - path: /api/master-values/by-container-type-mode
          methods: [ GET ]
        - path: /api/master-values/by-code
          methods: [ GET ]
        - path: /api/master-values/code-by-code-domain
          methods: [ GET ]
        - path: /api/master-values/disable-empty-back-charge
          methods: [ GET ]
        - path: /api/master-values/exchange-mandatory
          methods: [ GET ]
        - path: /api/master-values/validate-match
          methods: [ GET ]
        - path: /api/master-values/check-reference
          methods: [ GET ]
        - path: /api/master-values/master-term
          methods: [ GET ]
        - path: /api/master-values/master-term-description
          methods: [ GET ]
        - path: /api/master-values/max-display-seq
          methods: [ GET ]
        - path: /api/master-values/{id}
          methods: [ GET ]
        - path: /api/master-values/search
          methods: [ POST ]
        - path: /api/master-values/count
          methods: [ POST ]

        # audit-logs - readonly
        - path: /api/audit-logs/search
          methods: [ POST ]
        - path: /api/audit-logs/count
          methods: [ POST ]
        - path: /api/audit-logs/export
          methods: [ POST ]

        - path: /api/version
          methods: [ GET ]
