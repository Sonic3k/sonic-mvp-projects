# Override whitelist for prod environment
# Spring loads this on top of whitelist.yml when profile 'prod' is active
# Example: java -jar app.jar --spring.profiles.active=prod
# K8s:     env SPRING_PROFILES_ACTIVE=prod

gateway:
  backends:

    - id: mock-legacy
      base-url: ${MOCK_LEGACY_BASE_URL:http://localhost:8081}
      routes:
        - path: /legacy/api/products/**
          methods: [ GET ]
        - path: /legacy/api/orders/**
          methods: [ GET ]
        - path: /legacy/api/users/**
          methods: [ GET ]
        - path: /legacy/api/payments/**
          methods: [ GET ]
        - path: /legacy/api/auth/login
          methods: [ POST ]
        - path: /health
          methods: [ GET ]

    - id: mock-modernized
      base-url: ${MOCK_MODERNIZED_BASE_URL:http://localhost:8081}
      routes:
        - path: /modernized/api/products/**
          methods: [ GET ]
        - path: /modernized/api/orders/**
          methods: [ GET ]
        - path: /modernized/api/users/**
          methods: [ GET ]
        - path: /modernized/api/payments/**
          methods: [ GET ]
        - path: /modernized/api/auth/login
          methods: [ POST ]
        - path: /health
          methods: [ GET ]
